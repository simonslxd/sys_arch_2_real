<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 562" width="760" height="562" role="img" aria-labelledby="t d" class="viz">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
         --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
           --axis:#383835; --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill:var(--surface); }
  .title { fill:var(--ink); font-size:17px; font-weight:600; }
  .sub, .label { fill:var(--ink2); font-size:13px; }
  .value { fill:var(--ink); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tick { fill:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .xlab { fill:var(--ink2); font-size:13px; font-weight:600; }
  .th { fill:var(--ink2); font-size:12px; font-weight:600; }
  .td { fill:var(--ink); font-size:12px; font-variant-numeric:tabular-nums; }
  .rule { stroke:var(--grid); stroke-width:1; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .axis { stroke:var(--axis); stroke-width:1; }
  .line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .range { stroke-width:2; stroke-linecap:round; opacity:.45; }
  .dot { stroke:var(--surface); stroke-width:2; }
  .s1 { stroke:var(--s1); } .s2 { stroke:var(--s2); }
  .f1 { fill:var(--s1); } .f2 { fill:var(--s2); }
  .hit { fill:transparent; stroke:none; }
</style>
<title id="t">Benchmark, iterations 1 to 3: time per loan + return</title>
<desc id="d">Median nanoseconds per Lab::laan_ut + Lab::registrer_retur for iterations 1, 2 and 3 (the last three iterations), in a lab of 100 and of 3 students and items. Numbers: fom/final/benchmark.csv.</desc>
<rect class="bg" width="760" height="562"/>
<text class="title" x="64" y="30">Benchmark, iterations 1 to 3: time per loan + return</text>
<text class="sub" x="64" y="50">Median of 5 runs, all measured in one session; the vertical line spans the fastest to the slowest run. Lower is faster.</text>
<line class="line s1" x1="64" y1="73" x2="82" y2="73"/><circle class="dot f1" cx="73" cy="73" r="4"/><text class="label" x="90" y="77">lab of 100 students × 100 items</text>
<line class="line s2" x1="334" y1="73" x2="352" y2="73"/><circle class="dot f2" cx="343" cy="73" r="4"/><text class="label" x="360" y="77">lab of 3 students × 3 items</text>
<line class="grid" x1="64" y1="354.0" x2="590" y2="354.0"/><text class="tick" x="56" y="358.0" text-anchor="end">0</text>
<line class="grid" x1="64" y1="322.8" x2="590" y2="322.8"/><text class="tick" x="56" y="326.8" text-anchor="end">10</text>
<line class="grid" x1="64" y1="291.5" x2="590" y2="291.5"/><text class="tick" x="56" y="295.5" text-anchor="end">20</text>
<line class="grid" x1="64" y1="260.2" x2="590" y2="260.2"/><text class="tick" x="56" y="264.2" text-anchor="end">30</text>
<line class="grid" x1="64" y1="229.0" x2="590" y2="229.0"/><text class="tick" x="56" y="233.0" text-anchor="end">40</text>
<line class="grid" x1="64" y1="197.8" x2="590" y2="197.8"/><text class="tick" x="56" y="201.8" text-anchor="end">50</text>
<line class="grid" x1="64" y1="166.5" x2="590" y2="166.5"/><text class="tick" x="56" y="170.5" text-anchor="end">60</text>
<line class="grid" x1="64" y1="135.2" x2="590" y2="135.2"/><text class="tick" x="56" y="139.2" text-anchor="end">70</text>
<line class="grid" x1="64" y1="104.0" x2="590" y2="104.0"/><text class="tick" x="56" y="108.0" text-anchor="end">80</text>
<text class="tick" x="56" y="92" text-anchor="end">ns</text>
<line class="axis" x1="64" y1="354.0" x2="590" y2="354.0"/>
<text class="xlab" x="151.7" y="376.0" text-anchor="middle">Iteration 1</text><text class="tick" x="151.7" y="392.0" text-anchor="middle">benchmark, SRP review</text>
<text class="xlab" x="327.0" y="376.0" text-anchor="middle">Iteration 2</text><text class="tick" x="327.0" y="392.0" text-anchor="middle">“x av y ledig” counts</text>
<text class="xlab" x="502.3" y="376.0" text-anchor="middle">Iteration 3</text><text class="tick" x="502.3" y="392.0" text-anchor="middle">final dashboard</text>
<line class="range s1" x1="151.7" y1="175.9" x2="151.7" y2="154.0"/>
<line class="range s1" x1="327.0" y1="175.9" x2="327.0" y2="172.8"/>
<line class="range s1" x1="502.3" y1="175.9" x2="502.3" y2="172.8"/>
<polyline class="line s1" points="151.7,172.8 327.0,175.9 502.3,175.9"/>
<g><title>Iteration 1, lab of 100 students × 100 items: 58 ns (fastest run 57, slowest 64)</title><circle class="hit" cx="151.7" cy="172.8" r="12"/><circle class="dot f1" cx="151.7" cy="172.8" r="5"/></g>
<g><title>Iteration 2, lab of 100 students × 100 items: 57 ns (fastest run 57, slowest 58)</title><circle class="hit" cx="327.0" cy="175.9" r="12"/><circle class="dot f1" cx="327.0" cy="175.9" r="5"/></g>
<g><title>Iteration 3, lab of 100 students × 100 items: 57 ns (fastest run 57, slowest 58)</title><circle class="hit" cx="502.3" cy="175.9" r="12"/><circle class="dot f1" cx="502.3" cy="175.9" r="5"/></g>
<line class="range s2" x1="151.7" y1="272.8" x2="151.7" y2="269.6"/>
<line class="range s2" x1="327.0" y1="272.8" x2="327.0" y2="272.8"/>
<line class="range s2" x1="502.3" y1="272.8" x2="502.3" y2="272.8"/>
<polyline class="line s2" points="151.7,272.8 327.0,272.8 502.3,272.8"/>
<g><title>Iteration 1, lab of 3 students × 3 items: 26 ns (fastest run 26, slowest 27)</title><circle class="hit" cx="151.7" cy="272.8" r="12"/><circle class="dot f2" cx="151.7" cy="272.8" r="5"/></g>
<g><title>Iteration 2, lab of 3 students × 3 items: 26 ns (fastest run 26, slowest 26)</title><circle class="hit" cx="327.0" cy="272.8" r="12"/><circle class="dot f2" cx="327.0" cy="272.8" r="5"/></g>
<g><title>Iteration 3, lab of 3 students × 3 items: 26 ns (fastest run 26, slowest 26)</title><circle class="hit" cx="502.3" cy="272.8" r="12"/><circle class="dot f2" cx="502.3" cy="272.8" r="5"/></g>
<text class="value" x="518.3" y="179.9">100 × 100: 57 ns</text>
<text class="value" x="518.3" y="276.8">3 × 3: 26 ns</text>
<line class="rule" x1="64" y1="400" x2="736" y2="400"/>
<text class="th" x="64" y="416">Iteration</text>
<text class="th" x="214" y="416">100 × 100 lab</text>
<text class="th" x="364" y="416">3 × 3 lab</text>
<text class="td" x="64" y="438">1</text>
<text class="td" x="214" y="438">58 ns (57–64)</text>
<text class="td" x="364" y="438">26 ns (26–27)</text>
<text class="td" x="64" y="460">2</text>
<text class="td" x="214" y="460">57 ns (57–58)</text>
<text class="td" x="364" y="460">26 ns (26–26)</text>
<text class="td" x="64" y="482">3</text>
<text class="td" x="214" y="482">57 ns (57–58)</text>
<text class="td" x="364" y="482">26 ns (26–26)</text>
<text class="sub" x="64" y="518">Iteration 2 added two getters that loans and returns don't call; iteration 3 changed no domain code.</text>
<text class="sub" x="64" y="538">So the differences are measurement noise. Measured 2026-11-08 on Windows (MSYS2, D-18).</text>
</svg>
