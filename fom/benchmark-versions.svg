<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" class="viz">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9;
         --axis:#c3c2b7; --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a;
           --axis:#383835; --s1:#3987e5; --s2:#d95926; }
  }
  .bg { fill:var(--surface); }
  .title { fill:var(--ink); font-size:17px; font-weight:600; }
  .sub, .label { fill:var(--ink2); font-size:13px; }
  .tick { fill:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .axis { stroke:var(--axis); stroke-width:1; }
  .line { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .range { stroke-width:2; stroke-linecap:round; opacity:.45; }
  .dot { stroke:var(--surface); stroke-width:2; }
  .s1 { stroke:var(--s1); } .s2 { stroke:var(--s2); }
  .f1 { fill:var(--s1); } .f2 { fill:var(--s2); }
  .hit { fill:transparent; stroke:none; }
</style>
<title id="t">Benchmark per iteration: time per loan + return</title>
<desc id="d">Median nanoseconds per Lab::laan_ut + Lab::registrer_retur for each tagged iteration, for a lab of 3 and of 100 students and items. Numbers: fom/benchmark-versions.csv.</desc>
<rect class="bg" width="760" height="460"/>
<text class="title" x="64" y="30">Time per loan + return (ns), by iteration</text>
<text class="sub" x="64" y="50">Median of 5 runs; the vertical line spans the fastest to the slowest run. Lower is faster.</text>
<line class="line s1" x1="64" y1="71" x2="82" y2="71"/><circle class="dot f1" cx="73" cy="71" r="4"/><text class="label" x="90" y="75">lab of 3 × 3</text>
<line class="line s2" x1="254" y1="71" x2="272" y2="71"/><circle class="dot f2" cx="263" cy="71" r="4"/><text class="label" x="280" y="75">lab of 100 × 100</text>
<line class="grid" x1="64" y1="364.0" x2="610" y2="364.0"/><text class="tick" x="56" y="368.0" text-anchor="end">0</text>
<line class="grid" x1="64" y1="319.3" x2="610" y2="319.3"/><text class="tick" x="56" y="323.3" text-anchor="end">20</text>
<line class="grid" x1="64" y1="274.7" x2="610" y2="274.7"/><text class="tick" x="56" y="278.7" text-anchor="end">40</text>
<line class="grid" x1="64" y1="230.0" x2="610" y2="230.0"/><text class="tick" x="56" y="234.0" text-anchor="end">60</text>
<line class="grid" x1="64" y1="185.3" x2="610" y2="185.3"/><text class="tick" x="56" y="189.3" text-anchor="end">80</text>
<line class="grid" x1="64" y1="140.7" x2="610" y2="140.7"/><text class="tick" x="56" y="144.7" text-anchor="end">100</text>
<line class="grid" x1="64" y1="96.0" x2="610" y2="96.0"/><text class="tick" x="56" y="100.0" text-anchor="end">120</text>
<line class="axis" x1="64" y1="364.0" x2="610" y2="364.0"/>
<text class="tick" x="109.5" y="386.0" text-anchor="middle">iter-1</text>
<text class="tick" x="200.5" y="386.0" text-anchor="middle">iter-2 *</text>
<text class="tick" x="291.5" y="386.0" text-anchor="middle">iter-3</text>
<text class="tick" x="382.5" y="386.0" text-anchor="middle">iter-4</text>
<text class="tick" x="473.5" y="386.0" text-anchor="middle">iter-5</text>
<text class="tick" x="564.5" y="386.0" text-anchor="middle">iter-6</text>
<text class="sub" x="64" y="426">* The measured code (project/impl) changed in this version.</text>
<text class="sub" x="64" y="446">iter-3, iter-4, iter-5, iter-6: same code as the version before, so their differences are measurement noise.</text>
<line class="range s1" x1="109.5" y1="317.1" x2="109.5" y2="308.2"/>
<line class="range s1" x1="200.5" y1="312.6" x2="200.5" y2="308.2"/>
<line class="range s1" x1="291.5" y1="312.6" x2="291.5" y2="279.1"/>
<line class="range s1" x1="382.5" y1="312.6" x2="382.5" y2="301.5"/>
<line class="range s1" x1="473.5" y1="312.6" x2="473.5" y2="312.6"/>
<line class="range s1" x1="564.5" y1="312.6" x2="564.5" y2="279.1"/>
<polyline class="line s1" points="109.5,317.1 200.5,308.2 291.5,310.4 382.5,305.9 473.5,312.6 564.5,299.2"/>
<g><title>iter-1, lab of 3 × 3: median 21 ns (fastest 21, slowest 25; 5 runs)</title><circle class="hit" cx="109.5" cy="317.1" r="12"/><circle class="dot f1" cx="109.5" cy="317.1" r="4"/></g>
<g><title>iter-2, lab of 3 × 3: median 25 ns (fastest 23, slowest 25; 5 runs)</title><circle class="hit" cx="200.5" cy="308.2" r="12"/><circle class="dot f1" cx="200.5" cy="308.2" r="4"/></g>
<g><title>iter-3, lab of 3 × 3: median 24 ns (fastest 23, slowest 38; 5 runs)</title><circle class="hit" cx="291.5" cy="310.4" r="12"/><circle class="dot f1" cx="291.5" cy="310.4" r="4"/></g>
<g><title>iter-4, lab of 3 × 3: median 26 ns (fastest 23, slowest 28; 5 runs)</title><circle class="hit" cx="382.5" cy="305.9" r="12"/><circle class="dot f1" cx="382.5" cy="305.9" r="4"/></g>
<g><title>iter-5, lab of 3 × 3: median 23 ns (fastest 23, slowest 23; 5 runs)</title><circle class="hit" cx="473.5" cy="312.6" r="12"/><circle class="dot f1" cx="473.5" cy="312.6" r="4"/></g>
<g><title>iter-6, lab of 3 × 3: median 29 ns (fastest 23, slowest 38; 5 runs)</title><circle class="hit" cx="564.5" cy="299.2" r="12"/><circle class="dot f1" cx="564.5" cy="299.2" r="4"/></g>
<text class="label" x="578.5" y="303.2">3 × 3: 29 ns</text>
<line class="range s2" x1="109.5" y1="259.0" x2="109.5" y2="221.1"/>
<line class="range s2" x1="200.5" y1="216.6" x2="200.5" y2="142.9"/>
<line class="range s2" x1="291.5" y1="223.3" x2="291.5" y2="207.7"/>
<line class="range s2" x1="382.5" y1="221.1" x2="382.5" y2="192.0"/>
<line class="range s2" x1="473.5" y1="209.9" x2="473.5" y2="109.4"/>
<line class="range s2" x1="564.5" y1="218.8" x2="564.5" y2="201.0"/>
<polyline class="line s2" points="109.5,243.4 200.5,203.2 291.5,216.6 382.5,214.4 473.5,207.7 564.5,216.6"/>
<g><title>iter-1, lab of 100 × 100: median 54 ns (fastest 47, slowest 64; 5 runs)</title><circle class="hit" cx="109.5" cy="243.4" r="12"/><circle class="dot f2" cx="109.5" cy="243.4" r="4"/></g>
<g><title>iter-2, lab of 100 × 100: median 72 ns (fastest 66, slowest 99; 5 runs)</title><circle class="hit" cx="200.5" cy="203.2" r="12"/><circle class="dot f2" cx="200.5" cy="203.2" r="4"/></g>
<g><title>iter-3, lab of 100 × 100: median 66 ns (fastest 63, slowest 70; 5 runs)</title><circle class="hit" cx="291.5" cy="216.6" r="12"/><circle class="dot f2" cx="291.5" cy="216.6" r="4"/></g>
<g><title>iter-4, lab of 100 × 100: median 67 ns (fastest 64, slowest 77; 5 runs)</title><circle class="hit" cx="382.5" cy="214.4" r="12"/><circle class="dot f2" cx="382.5" cy="214.4" r="4"/></g>
<g><title>iter-5, lab of 100 × 100: median 70 ns (fastest 69, slowest 114; 5 runs)</title><circle class="hit" cx="473.5" cy="207.7" r="12"/><circle class="dot f2" cx="473.5" cy="207.7" r="4"/></g>
<g><title>iter-6, lab of 100 × 100: median 66 ns (fastest 65, slowest 73; 5 runs)</title><circle class="hit" cx="564.5" cy="216.6" r="12"/><circle class="dot f2" cx="564.5" cy="216.6" r="4"/></g>
<text class="label" x="578.5" y="220.6">100 × 100: 66 ns</text>
</svg>
